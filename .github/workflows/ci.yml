# The gate, hosted. Both jobs build DualC's C ABI from the submodule with
# scripts/build_native.py and then run scripts/check.py -- the same command the
# developer runs. The Windows job additionally builds the GPU viewer and the
# DualCEditor side-car (Qt 6) and packages the plugin as one .yak (an artifact of
# the run; nothing is ever pushed to the Yak server).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: gate (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: DualC pin
        id: pin
        run: echo "sha=$(git rev-parse HEAD:external/DualC)" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # The DualC build tree changes only when the pin or the recipe moves, so the
      # whole tree (objects included) is cached on those two keys.
      - uses: actions/cache@v4
        with:
          path: build-native
          key: native-${{ runner.os }}-${{ steps.pin.outputs.sha }}-${{ hashFiles('scripts/build_native.py') }}
          # A recipe edit reuses the last tree at the same pin (its fetched sources included).
          restore-keys: native-${{ runner.os }}-${{ steps.pin.outputs.sha }}-

      - name: Build the native side from the submodule
        shell: bash
        run: |
          set -o pipefail
          # Three attempts, but only when the failure is a fetch: DualC's configure clones
          # geometry-central, Eigen (gitlab.com) and glfw, and a provider outage is not a
          # build error (2026-10-23: two runs red on "GitLab is currently unable to handle
          # this request due to load"). Any other failure ends the step at once.
          for attempt in 1 2 3; do
            if python3 scripts/build_native.py 2>&1 | tee native.log; then exit 0; fi
            grep -qiE 'unable to handle this request|could not resolve host|failed to connect|unable to access|rpc failed|unexpected disconnect|connection timed out|remote error' native.log || exit 1
            echo "::warning title=native::attempt $attempt failed on a fetch; retrying in 60 s"
            sleep 60
          done
          exit 1

      - name: Native build report as annotations
        if: failure()
        shell: bash
        run: |
          grep -inE 'error|fatal|traceback|build_native:' native.log | head -40 | while IFS= read -r l; do echo "::error title=native::$l"; done || true
          tail -30 native.log | while IFS= read -r l; do echo "::error title=native tail::$l"; done || true

      - name: Gate
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check.py 2>&1 | tee gate.log

      # The gate's own report, as annotations: which check failed and its detail
      # lines, readable from the run page and the public API without the full log.
      - name: Gate report as annotations
        if: failure()
        shell: bash
        run: |
          grep -E '^\[FAIL\]' gate.log | while IFS= read -r l; do echo "::error title=gate::$l"; done || true
          awk '/^--- /{p=1} p' gate.log | head -80 | while IFS= read -r l; do echo "::error title=gate detail::$l"; done || true
          # A failed test is run once more on the same build: a second verdict tells a
          # flaky test from a broken one, and the assertion lines reach the annotations.
          if grep -q '^\[FAIL\] dotnet-test' gate.log; then
            extra=""; [ "$RUNNER_OS" != "Windows" ] && extra="-p:EnableWindowsTargeting=true"
            dotnet test tests/Boletus.Core.Tests/Boletus.Core.Tests.csproj -c Debug --no-build --nologo $extra 2>&1 \
              | grep -E 'Passed!|Failed!|\[FAIL\]|Assert|Expected|Actual|\[dualc\] (error|warning)|DualcException' | head -40 \
              | while IFS= read -r l; do echo "::error title=retry::$l"; done || true
          fi

      - name: Gate, strict docs
        run: python3 scripts/check.py --docs --strict

      - name: Gate selftest
        run: python3 scripts/check.py --selftest

  windows:
    name: gate + package (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: DualC and DualCEditor pins
        id: pin
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD:external/DualC)" >> "$GITHUB_OUTPUT"
          echo "editor=$(git rev-parse HEAD:external/DualCEditor 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Qt for the DualCEditor side-car (the editor's own gate uses the same action and
      # version); QT_ROOT_DIR is what build_native.py reads. Never continue-on-error: a
      # .yak quietly missing the editor must be a red run, not a silent fallback.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true

      # Both pins and the recipe key the cache: the editor tree compiles DualC's host libs too.
      - uses: actions/cache@v4
        with:
          path: |
            build-native
            build-native-editor
          key: native-${{ runner.os }}-${{ steps.pin.outputs.sha }}-${{ steps.pin.outputs.editor }}-${{ hashFiles('scripts/build_native.py') }}
          # A recipe or editor-pin change reuses the last tree at the same DualC pin (its
          # fetched sources included); cmake re-configures incrementally on top.
          restore-keys: |
            native-${{ runner.os }}-${{ steps.pin.outputs.sha }}-${{ steps.pin.outputs.editor }}-
            native-${{ runner.os }}-${{ steps.pin.outputs.sha }}-

      # The output is kept: a failing configure is read from the annotations below, not
      # from the full log (which the public API serves only with a token).
      - name: Build the native side from the submodules (C ABI + viewer + editor)
        shell: bash
        run: |
          set -o pipefail
          # Three attempts, but only when the failure is a fetch: DualC's configure clones
          # geometry-central, Eigen (gitlab.com) and glfw, and a provider outage is not a
          # build error (2026-10-23: two runs red on "GitLab is currently unable to handle
          # this request due to load"). Any other failure ends the step at once.
          for attempt in 1 2 3; do
            if python scripts/build_native.py 2>&1 | tee native.log; then exit 0; fi
            grep -qiE 'unable to handle this request|could not resolve host|failed to connect|unable to access|rpc failed|unexpected disconnect|connection timed out|remote error' native.log || exit 1
            echo "::warning title=native::attempt $attempt failed on a fetch; retrying in 60 s"
            sleep 60
          done
          exit 1

      - name: Native build report as annotations
        if: failure()
        shell: bash
        run: |
          grep -inE 'error|fatal|traceback|build_native:' native.log | head -40 | while IFS= read -r l; do echo "::error title=native::$l"; done || true
          tail -30 native.log | while IFS= read -r l; do echo "::error title=native tail::$l"; done || true

      - name: Gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/check.py 2>&1 | tee gate.log

      - name: Gate report as annotations
        if: failure()
        shell: bash
        run: |
          grep -E '^\[FAIL\]' gate.log | while IFS= read -r l; do echo "::error title=gate::$l"; done || true
          awk '/^--- /{p=1} p' gate.log | head -80 | while IFS= read -r l; do echo "::error title=gate detail::$l"; done || true
          # A failed test is run once more on the same build: a second verdict tells a
          # flaky test from a broken one, and the assertion lines reach the annotations.
          if grep -q '^\[FAIL\] dotnet-test' gate.log; then
            extra=""; [ "$RUNNER_OS" != "Windows" ] && extra="-p:EnableWindowsTargeting=true"
            dotnet test tests/Boletus.Core.Tests/Boletus.Core.Tests.csproj -c Debug --no-build --nologo $extra 2>&1 \
              | grep -E 'Passed!|Failed!|\[FAIL\]|Assert|Expected|Actual|\[dualc\] (error|warning)|DualcException' | head -40 \
              | while IFS= read -r l; do echo "::error title=retry::$l"; done || true
          fi

      # The solution, not the project: its configuration rows map every project to x64,
      # which puts the .gha under bin/x64/Release/ (a bare project build lands in
      # bin/Release/ with Platform=AnyCPU and the staging step finds nothing).
      - name: Release build of the plugin
        run: dotnet build Boletus.sln -c Release

      - name: Stage the package
        shell: pwsh
        run: |
          $out = "src/Boletus.Grasshopper/bin/x64/Release"
          New-Item -ItemType Directory -Force dist/boletus | Out-Null
          Copy-Item yak/manifest.yml dist/boletus/
          foreach ($f in "Boletus.Grasshopper.gha", "Boletus.Core.dll", "dualc_capi.dll", "dualc_field_view.exe") {
            Copy-Item "$out/$f" dist/boletus/
          }
          # The editor folder, whole (DualCEditor.exe, the Qt runtime, LICENSES/); the two
          # files every working deploy has are asserted so a half-deployed folder fails here.
          Copy-Item -Recurse "$out/editor" dist/boletus/editor
          foreach ($f in "editor/DualCEditor.exe", "editor/Qt6Core.dll", "editor/platforms/qwindows.dll", "editor/LICENSES/THIRD-PARTY.md") {
            if (-not (Test-Path "dist/boletus/$f")) { throw "missing from the package: $f" }
          }
          Get-ChildItem -Recurse dist/boletus | Select-Object FullName, Length
          "editor folder: {0:N1} MB" -f ((Get-ChildItem -Recurse dist/boletus/editor | Measure-Object Length -Sum).Sum / 1MB)

      - name: yak build
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://files.mcneel.com/yak/tools/latest/yak.exe -OutFile yak.exe
          Set-Location dist/boletus
          & ../../yak.exe build --platform win
          Get-ChildItem *.yak | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: boletus-yak
          path: dist/boletus/*.yak
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: boletus-gha-folder
          path: |
            dist/boletus/
            !dist/boletus/*.yak
          if-no-files-found: error
